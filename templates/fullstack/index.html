<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Data workspace</title><link rel="stylesheet" href="/style.css"><script src="/app.js" defer></script></head>
<body><main><header><p>LOCAL DATABASE WORKSPACE</p><h1 id="title">Data workspace</h1><p id="description"></p></header>
<section aria-labelledby="edit-heading"><h2 id="edit-heading">Add or edit record</h2>
<form id="editor"><label>Title<input id="name" required maxlength="160"></label><label>Notes<textarea id="notes" maxlength="2000" rows="3"></textarea></label><div id="model-fields"></div><button id="submit">Add record</button><button type="button" id="cancel">Clear</button></form></section>
<section aria-labelledby="items-heading"><h2 id="items-heading">Records</h2>
<form id="filters"><label>Search<input id="search" maxlength="200"></label><label>Status<select id="filter"><option value="all">All</option><option value="open">Open</option><option value="done">Completed</option></select></label><button>Apply filters</button></form>
<p id="status" role="status" aria-live="polite"></p><ul id="items"></ul></section>
<p>Data is saved in a local SQLite database. Do not enter sensitive information or expose this server publicly.</p></main></body></html>
