<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Relational workspace</title><link rel="stylesheet" href="/style.css"><script src="/app.js" defer></script></head>
<body><main><header><p>LOCAL RELATIONAL WORKSPACE</p><h1 id="title">Relational workspace</h1><p id="description"></p></header>
<section aria-labelledby="collection-heading"><h2 id="collection-heading">Choose a collection</h2>
<label for="table">Table</label><select id="table" disabled></select>
<p id="status" role="status" aria-live="polite">Loading workspace…</p></section>
<section aria-labelledby="editor-heading"><h2 id="editor-heading">Add or edit record</h2>
<form id="editor"><div id="fields"></div><button id="submit" disabled>Add record</button><button id="clear" type="button" disabled>Clear</button></form></section>
<section aria-labelledby="record-heading"><h2 id="record-heading">Records</h2>
<ul id="records"></ul></section>
<p>Records are stored on this device. Do not enter sensitive information or expose the server publicly.</p>
<noscript>JavaScript is required for this workspace.</noscript></main></body></html>
