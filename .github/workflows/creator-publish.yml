name: Publish reviewed creator project

on:
  workflow_dispatch:
    inputs:
      publish:
        description: Confirm publication of the reviewed projects/publish.json to GitHub Pages
        type: boolean
        required: true
        default: false

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == 'refs/heads/main' && inputs.publish
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.12"
      - name: Run creator regression tests
        run: python -m unittest discover -s tests -v
      - name: Build reviewed project
        run: python scripts/creator_project.py build --spec projects/publish.json --output build/publish --publish
      - name: Verify output against approved specification
        run: python scripts/creator_project.py verify --spec projects/publish.json --output build/publish --publish
      - uses: actions/upload-pages-artifact@v5
        with:
          path: build/publish
  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy reviewed output
        id: deployment
        uses: actions/deploy-pages@v5
