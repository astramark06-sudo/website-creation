name: Creator studio browser verification

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  chromium:
    name: Studio and generated website Chromium smoke tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.12"
      - name: Install pinned browser test tool
        run: python -m pip install "playwright==1.51.0"
      - name: Install Chromium
        run: python -m playwright install --with-deps chromium
      - name: Verify real browser behavior
        run: python -m unittest discover -s tests/browser -v
